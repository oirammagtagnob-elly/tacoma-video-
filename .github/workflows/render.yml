name: Render video

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "draft = small and fast, full = final quality"
        type: choice
        options: [draft, full]
        default: draft
      format:
        description: "Video shape"
        type: choice
        options: [vertical, wide]
        default: vertical
      voice:
        description: "Make a real voiceover with ElevenLabs (needs the ELEVENLABS_API_KEY secret)"
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack the project
        run: |
          F=$(ls project-bundle.* | head -1)
          echo "Using $F"
          base64 -d "$F" > three-remotion.zip
          unzip -q -o three-remotion.zip

      - name: Install system libraries for Chrome
        run: >
          sudo apt-get update && sudo apt-get install -y
          libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev
          libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libpango-1.0-0 libcairo2 libcups2

      - name: Install the project
        working-directory: three-remotion
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: bash setup.sh

      - name: Make the voiceover
        if: ${{ inputs.voice }}
        working-directory: three-remotion
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            node scripts/generate-voiceover.mjs
          else
            echo "No ELEVENLABS_API_KEY secret found. Using the silent placeholder."
          fi

      - name: Render
        working-directory: three-remotion
        run: |
          ARGS="--gl=swangle"
          if [ "${{ inputs.format }}" = "wide" ]; then ARGS="$ARGS --props=props-wide.json"; fi
          if [ "${{ inputs.quality }}" = "draft" ]; then ARGS="$ARGS --scale=0.5"; fi
          npx remotion render src/index.ts MainVideo out/video.mp4 $ARGS

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: tacoma-video
          path: three-remotion/out/video.mp4
          retention-days: 7
